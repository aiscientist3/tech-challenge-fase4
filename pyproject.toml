[project]
name = "voc-rag"
version = "0.1.0"
description = "Ingestão das avaliações da Olist em um banco vetorial Chroma."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "sentence-transformers>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
voc-rag = "voc_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/voc_rag"]

[tool.hatch.build.targets.wheel.sources]
"src/voc_rag" = "voc_rag"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
